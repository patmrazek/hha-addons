name: Bambu Stats
version: "0.2.1"
slug: bambu_stats
description: Historie tisků, lifetime statistiky a spotřeba filamentu pro tiskárny Bambu Lab (SQLite + MQTT Discovery)
url: https://github.com/patmrazek/hha-addons
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
homeassistant_api: true
hassio_api: true
services:
  - mqtt:need
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Health endpoint (jen pro watchdog, není třeba vystavovat)
watchdog: http://[HOST]:[PORT:8099]/health
map:
  - share:rw
options:
  printer_name: P2S
  printer_host: ""
  printer_serial: ""
  access_code: ""
  ha_weight_entity: sensor.p2s_print_weight
  ha_length_entity: sensor.p2s_print_length
  entity_prefix: bambu_p2s
  currency: CZK
  filament_prices:
    - material: PLA
      price_per_kg: 599
    - material: PETG
      price_per_kg: 649
    - material: ABS
      price_per_kg: 699
    - material: ASA
      price_per_kg: 799
    - material: TPU
      price_per_kg: 899
    - material: OTHER
      price_per_kg: 700
  samples_retention_days: 90
  log_level: info
  tls_verify: tofu
schema:
  printer_name: str
  printer_host: str
  printer_serial: str
  access_code: password
  ha_weight_entity: str?
  ha_length_entity: str?
  printers:
    - name: str
      host: str
      serial: str
      access_code: password
      ha_weight_entity: str?
      ha_length_entity: str?
  entity_prefix: match(^[a-z][a-z0-9_]*$)
  currency: str
  filament_prices:
    - material: str
      price_per_kg: float(0,)
  samples_retention_days: int(7,3650)
  log_level: list(debug|info|warning|error)
  tls_verify: list(tofu|none)
