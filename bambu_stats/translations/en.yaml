configuration:
  printer_name:
    name: Printer name
  printer_host:
    name: Printer IP / hostname
    description: Use a DHCP reservation so the address does not change.
  printer_serial:
    name: Serial number
    description: 15 characters, printer Settings → Device (or Bambu Studio).
  access_code:
    name: Access code
    description: Printer Settings → WLAN. Treated as a password.
  ha_weight_entity:
    name: Fallback weight entity
    description: ha-bambulab entity with print weight from Bambu cloud (e.g. sensor.p2s_print_weight). Optional.
  ha_length_entity:
    name: Fallback length entity
    description: ha-bambulab entity with print length (e.g. sensor.p2s_print_length). Optional.
  printers:
    name: Additional printers (advanced)
    description: Only when one add-on should watch several printers; otherwise leave empty and use the fields above.
  currency:
    name: Currency
    description: ISO code shown on cost entities (CZK, EUR…).
  filament_prices:
    name: Filament prices per kg
    description: Price per kilogram by material group (PLA, PETG, ABS, ASA, TPU, OTHER). Costs = slicer weight × price – an estimate. Set your real spool prices.
  entity_prefix:
    name: Entity prefix
    description: Prefix for generated entities, e.g. bambu_p2s → sensor.bambu_p2s_total_prints.
  sync_repo:
    name: Sync repository (URL)
    description: Private git repo shared by all locations, e.g. https://github.com/<user>/HHA-bambu-data.git. Each add-on instance writes its own file, imports the others.
  sync_token:
    name: Sync token
    description: Fine-grained GitHub PAT with Contents read/write on that repo only.
  sync_instance:
    name: Instance name
    description: Unique per location, e.g. hacienda / podharfou.
  sync_interval_min:
    name: Sync interval (min)
  spoolman_url:
    name: Spoolman URL
    description: e.g. http://192.168.0.10:7912. Spools assigned to AMS trays (SpoolmanSync extra.active_tray) get their usage deducted after each print and their real price is used for costs.
  maintenance_every_hours:
    name: Maintenance interval (print hours)
    description: Lubrication / cleaning reminder after this many print hours since the Maintenance done button.
  desiccant_every_days:
    name: Desiccant interval (days)
    description: AMS desiccant change reminder after this many days since the Desiccant changed button.
  samples_retention_days:
    name: Telemetry retention (days)
  log_level:
    name: Log level
  tls_verify:
    name: Printer TLS verification
    description: tofu = pin the certificate on first connection and warn if it changes; none = do not verify.
