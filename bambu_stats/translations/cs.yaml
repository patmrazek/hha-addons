configuration:
  printers:
    name: Tiskárny
    description: Jedna položka na tiskárnu – název, IP/hostname, sériové číslo, access code (na tiskárně Nastavení → WLAN). Volitelně entity ha-bambulab s hmotností/délkou tisku jako záložní zdroj spotřeby filamentu.
  entity_prefix:
    name: Prefix entit
    description: Prefix generovaných entit v Home Assistantu, např. bambu_p2s → sensor.bambu_p2s_total_prints.
  samples_retention_days:
    name: Retence telemetrie (dny)
    description: Jak dlouho držet podvzorkovanou telemetrii. Historie tisků se drží trvale.
  log_level:
    name: Úroveň logování
  tls_verify:
    name: Ověření TLS tiskárny
    description: tofu = při prvním připojení si zapamatovat certifikát tiskárny a varovat při změně; none = neověřovat.
