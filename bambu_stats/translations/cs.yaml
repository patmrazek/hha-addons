configuration:
  printer_name:
    name: Název tiskárny
  printer_host:
    name: IP / hostname tiskárny
    description: Nastav DHCP rezervaci, aby se adresa neměnila.
  printer_serial:
    name: Sériové číslo
    description: 15 znaků, na tiskárně Nastavení → Zařízení (nebo v Bambu Studiu).
  access_code:
    name: Access code
    description: Na tiskárně Nastavení → WLAN. Zacházej s ním jako s heslem.
  ha_weight_entity:
    name: Záložní entita hmotnosti
    description: Entita ha-bambulab s hmotností tisku z Bambu cloudu (např. sensor.p2s_print_weight). Nepovinné.
  ha_length_entity:
    name: Záložní entita délky
    description: Entita ha-bambulab s délkou filamentu (např. sensor.p2s_print_length). Nepovinné.
  printers:
    name: Další tiskárny (pokročilé)
    description: Jen když má jeden add-on hlídat víc tiskáren; jinak nech prázdné a použij pole výše.
  entity_prefix:
    name: Prefix entit
    description: Prefix generovaných entit, např. bambu_p2s → sensor.bambu_p2s_total_prints.
  samples_retention_days:
    name: Retence telemetrie (dny)
  log_level:
    name: Úroveň logování
  tls_verify:
    name: Ověření TLS tiskárny
    description: tofu = při prvním připojení si zapamatovat certifikát a varovat při změně; none = neověřovat.
