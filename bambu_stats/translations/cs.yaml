configuration:
  printer_name:
    name: Název tiskárny
  printer_host:
    name: IP / hostname tiskárny
    description: Nastav DHCP rezervaci, aby se adresa neměnila.
  printer_serial:
    name: Sériové číslo
    description: 15 znaků, na tiskárně Nastavení → Zařízení (nebo v Bambu Studiu).
  access_code:
    name: Access code
    description: Na tiskárně Nastavení → WLAN. Zacházej s ním jako s heslem.
  ha_weight_entity:
    name: Záložní entita hmotnosti
    description: Entita ha-bambulab s hmotností tisku z Bambu cloudu (např. sensor.p2s_print_weight). Nepovinné.
  ha_length_entity:
    name: Záložní entita délky
    description: Entita ha-bambulab s délkou filamentu (např. sensor.p2s_print_length). Nepovinné.
  printers:
    name: Další tiskárny (pokročilé)
    description: Jen když má jeden add-on hlídat víc tiskáren; jinak nech prázdné a použij pole výše.
  currency:
    name: Měna
    description: ISO kód u nákladových entit (CZK, EUR…).
  filament_prices:
    name: Ceny filamentu za kg
    description: Cena za kilogram podle skupiny materiálu (PLA, PETG, ABS, ASA, TPU, OTHER). Náklady = hmotnost ze sliceru × cena – odhad. Nastav skutečné ceny svých cívek.
  entity_prefix:
    name: Prefix entit
    description: Prefix generovaných entit, např. bambu_p2s → sensor.bambu_p2s_total_prints.
  sync_repo:
    name: Repozitář pro synchronizaci (URL)
    description: Privátní git repo sdílené všemi lokalitami, např. https://github.com/<user>/HHA-bambu-data.git. Každá instance zapisuje svůj soubor a načítá ostatní.
  sync_token:
    name: Token pro synchronizaci
    description: Fine-grained GitHub PAT s právem Contents read/write jen na toto repo.
  sync_instance:
    name: Název instance
    description: Unikátní per lokalita, např. hacienda / podharfou.
  sync_interval_min:
    name: Interval synchronizace (min)
  spoolman_url:
    name: URL Spoolmanu
    description: např. http://192.168.0.10:7912. Cívkám přiřazeným k AMS slotům (SpoolmanSync extra.active_tray) se po tisku odečte spotřeba a jejich skutečná cena se použije pro náklady.
  samples_retention_days:
    name: Retence telemetrie (dny)
  log_level:
    name: Úroveň logování
  tls_verify:
    name: Ověření TLS tiskárny
    description: tofu = při prvním připojení si zapamatovat certifikát a varovat při změně; none = neověřovat.
